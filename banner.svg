<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ws { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .7; } }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1411"/>
      <stop offset="0.55" stop-color="#3b261b"/>
      <stop offset="1" stop-color="#7a4a2a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.86" r="0.5">
      <stop offset="0" stop-color="#f3bc7e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3bc7e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- desktop: the wallpaper seen through the cutout -->
  <rect x="40" y="0" width="860" height="500" fill="url(#wall)"/>
  <rect x="40" y="0" width="860" height="500" fill="url(#sun)"/>
  <path d="M40 430 C 200 380, 330 420, 470 395 S 760 360, 900 400 V500 H40Z" fill="#120d0b" opacity="0.55"/>
  <path d="M40 460 C 230 430, 420 470, 600 445 S 820 430, 900 450 V500 H40Z" fill="#0b0807" opacity="0.7"/>

  <!-- terminal window on the desktop -->
  <g>
    <rect x="96" y="150" width="440" height="296" rx="22" fill="#15110f" fill-opacity="0.94"/>
    <rect x="95" y="149" width="442" height="298" rx="23" fill="none" stroke="#f3bc7e" stroke-width="2.5" stroke-opacity="0.9"/>
    <g font-size="15">
      <text x="124" y="190" fill="#f3bc7e" font-weight="bold">❯ <tspan fill="#ece0d6" font-weight="normal">whoami</tspan></text>
      <text x="124" y="216" fill="#ece0d6" font-weight="bold">andrey <tspan fill="#9c8f84" font-weight="normal">· anaidyss</tspan></text>

      <text x="124" y="256" fill="#f3bc7e" font-weight="bold">❯ <tspan fill="#ece0d6" font-weight="normal">fastfetch</tspan></text>
      <text x="124" y="282" fill="#9c8f84">os   <tspan fill="#ece0d6">arch linux</tspan></text>
      <text x="124" y="304" fill="#9c8f84">wm   <tspan fill="#ece0d6">hyprland 0.57</tspan></text>
      <text x="124" y="326" fill="#9c8f84">ui   <tspan fill="#ece0d6">hypr-shell <tspan fill="#9c8f84">(quickshell, qml)</tspan></tspan></text>
      <text x="124" y="348" fill="#9c8f84">code <tspan fill="#ece0d6">python · qml · lua · bash</tspan></text>
      <text x="124" y="370" fill="#9c8f84">from <tspan fill="#ece0d6">russia <tspan fill="#9c8f84">→</tspan> hangzhou</tspan></text>
      <g transform="translate(124 392)">
        <rect x="0" y="0" width="18" height="12" rx="3" fill="#f3bc7e"/>
        <rect x="24" y="0" width="18" height="12" rx="3" fill="#e0a067"/>
        <rect x="48" y="0" width="18" height="12" rx="3" fill="#c98b66"/>
        <rect x="72" y="0" width="18" height="12" rx="3" fill="#b9a089"/>
        <rect x="96" y="0" width="18" height="12" rx="3" fill="#8f7d6e"/>
        <rect x="120" y="0" width="18" height="12" rx="3" fill="#5a3e1c"/>
      </g>
      <text x="124" y="432" fill="#f3bc7e" font-weight="bold">❯ <tspan class="caret" fill="#ece0d6">▌</tspan></text>
    </g>
  </g>

  <!-- now playing card -->
  <g>
    <rect x="574" y="300" width="270" height="146" rx="22" fill="#15110f" fill-opacity="0.9"/>
    <rect x="596" y="322" width="56" height="56" rx="14" fill="#f3bc7e"/>
    <path d="M616 338 v24 l18 -12z" fill="#3a230d"/>
    <text x="666" y="342" font-size="14" fill="#ece0d6" font-weight="bold">lyrics, synced</text>
    <text x="666" y="364" font-size="12" fill="#9c8f84">karaoke fill · eq · cava</text>
    <rect x="596" y="398" width="226" height="5" rx="2.5" fill="#3a2e27"/>
    <rect x="596" y="398" width="132" height="5" rx="2.5" fill="#f3bc7e"/>
    <circle cx="728" cy="400.5" r="7" fill="#f3bc7e"/>
    <text x="596" y="428" font-size="11" fill="#9c8f84">1:42</text>
    <text x="822" y="428" font-size="11" fill="#9c8f84" text-anchor="end">3:58</text>
  </g>

  <!-- the frame: screen minus the cutout, with the dashboard branch hanging from the top edge -->
  <path fill-rule="evenodd" fill="#1b1714" d="
    M28 0 H872 A28 28 0 0 1 900 28 V472 A28 28 0 0 1 872 500 H28 A28 28 0 0 1 0 472 V28 A28 28 0 0 1 28 0 Z
    M78 12 H294 A18 18 0 0 1 312 30 V112 A24 24 0 0 0 336 136 H564 A24 24 0 0 0 588 112 V30 A18 18 0 0 1 606 12
    H866 A22 22 0 0 1 888 34 V466 A22 22 0 0 1 866 488 H78 A22 22 0 0 1 56 466 V34 A22 22 0 0 1 78 12 Z"/>
  <path fill="url(#sheen)" fill-rule="evenodd" d="
    M28 0 H872 A28 28 0 0 1 900 28 V472 A28 28 0 0 1 872 500 H28 A28 28 0 0 1 0 472 V28 A28 28 0 0 1 28 0 Z
    M78 12 H294 A18 18 0 0 1 312 30 V112 A24 24 0 0 0 336 136 H564 A24 24 0 0 0 588 112 V30 A18 18 0 0 1 606 12
    H866 A22 22 0 0 1 888 34 V466 A22 22 0 0 1 866 488 H78 A22 22 0 0 1 56 466 V34 A22 22 0 0 1 78 12 Z"/>

  <!-- dashboard branch content -->
  <text x="450" y="46" font-size="21" fill="#ece0d6" font-weight="bold" text-anchor="middle">hypr-shell</text>
  <g font-size="12" text-anchor="middle">
    <text x="364" y="84" fill="#ece0d6">dashboard</text>
    <text x="436" y="84" fill="#9c8f84">media</text>
    <text x="492" y="84" fill="#9c8f84">perf</text>
    <text x="548" y="84" fill="#9c8f84">drives</text>
  </g>
  <rect x="338" y="93" width="52" height="3" rx="1.5" fill="#f3bc7e"/>
  <rect x="330" y="104" width="240" height="1" fill="#ece0d6" fill-opacity="0.08"/>
  <text x="450" y="124" font-size="11" fill="#9c8f84" text-anchor="middle">every menu grows out of the frame</text>

  <!-- the rail -->
  <g>
    <text x="28" y="40" font-size="20" fill="#f3bc7e" font-weight="bold" text-anchor="middle">▲</text>
    <rect x="10" y="58" width="36" height="96" rx="14" fill="#2a241f"/>
    <rect x="18" y="68" width="20" height="20" rx="6" fill="#f3bc7e" fill-opacity="0.9"/>
    <rect x="18" y="96" width="20" height="20" rx="6" fill="#4a3f37"/>
    <rect x="18" y="124" width="20" height="20" rx="6" fill="#4a3f37"/>
    <rect x="10" y="164" width="36" height="110" rx="14" fill="#2a241f"/>
    <rect class="ws" x="23" y="174" width="10" height="30" rx="5" fill="#f3bc7e"/>
    <circle cx="28" cy="216" r="4" fill="#6b5e54"/>
    <circle cx="28" cy="232" r="4" fill="#6b5e54"/>
    <circle cx="28" cy="248" r="4" fill="#6b5e54"/>
    <circle cx="28" cy="264" r="4" fill="#4a3f37"/>
    <rect x="10" y="284" width="36" height="58" rx="14" fill="#2a241f"/>
    <text x="28" y="309" font-size="14" fill="#ece0d6" font-weight="bold" text-anchor="middle">00</text>
    <text x="28" y="331" font-size="14" fill="#ece0d6" font-weight="bold" text-anchor="middle">51</text>
    <rect x="10" y="392" width="36" height="58" rx="14" fill="#2a241f"/>
    <circle cx="28" cy="408" r="5" fill="none" stroke="#9c8f84" stroke-width="2"/>
    <rect x="21" y="424" width="14" height="16" rx="4" fill="none" stroke="#9c8f84" stroke-width="2"/>
    <circle cx="28" cy="472" r="7" fill="none" stroke="#9c8f84" stroke-width="2"/>
    <rect x="27" y="463" width="2" height="7" fill="#9c8f84"/>
  </g>
</svg>
